spring.application.name=trishul-crm

# ---------------- Server ----------------
server.port=8080
server.servlet.context-path=/

# ---------------- TiDB DataSource ----------------
spring.datasource.url=jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/trishul_crm?sslMode=VERIFY_IDENTITY&serverSslCert=classpath:ca.pem
spring.datasource.username=4RiUt6wPfpEoBtA.root

spring.datasource.password=5HvfdgJCcNvytxwb

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

# ---------------- JPA / Hibernate ----------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# SQL init is disabled - schema is generated by Hibernate (ddl-auto=update)
# and sample data is inserted by DataSeeder.java on first boot.
# database/trishul_crm.sql is provided separately for manual DB setup.
spring.sql.init.mode=never

# ---------------- Session ----------------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ---------------- Jackson ----------------
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------------- Logging ----------------
logging.level.root=INFO
logging.level.com.trishul.crm=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ---------------- Multipart ----------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
