# ==========================================================
# Trishul CRM - Application Configuration
# ==========================================================

spring.application.name=trishul-crm

# ---------------- Server ----------------
server.port=8080
server.servlet.context-path=/
# Render (and most PaaS hosts) terminate HTTPS in front and forward plain
# HTTP internally, adding X-Forwarded-Proto/Host headers. Without this,
# Spring may not realize the original request was HTTPS, which can affect
# secure-cookie handling and redirect URLs behind the proxy.
server.forward-headers-strategy=framework

# ---------------- MySQL DataSource ----------------
# ---------------- MySQL / TiDB DataSource ----------------
# Reads from environment variables when set (Render production), falls back
# to local MySQL defaults for development. Set these three env vars on
# Render: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/trishul_crm?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP tuning — TiDB Cloud Serverless (and similar managed gateways)
# silently drop idle connections on the proxy side before Hikari's default
# max-lifetime expires. Without this, a connection that looks "alive" to
# Hikari but is actually dead gets reused a few seconds after the previous
# successful request, causing an intermittent 500 on the very next call
# (e.g. GET /me right after a successful POST /login).
spring.datasource.hikari.max-lifetime=270000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=150000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10

# ---------------- JPA / Hibernate ----------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# SQL init is disabled - schema is generated by Hibernate (ddl-auto=update)
# and sample data is inserted by DataSeeder.java on first boot.
# database/trishul_crm.sql is provided separately for manual DB setup.
spring.sql.init.mode=never

# ---------------- Session ----------------
# SameSite=None + Secure=true is REQUIRED for the session cookie to survive
# a cross-origin deployment (frontend on Vercel, backend on Render are two
# different registrable domains). SameSite=Lax (the old default) is blocked
# by browsers on cross-site fetch() calls, so /me and every other request
# after login would silently go out with no cookie attached at all.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

# ---------------- Jackson ----------------
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------------- Logging ----------------
logging.level.root=INFO
logging.level.com.trishul.crm=DEBUG
logging.level.org.springframework.security=INFO

# ---------------- Multipart ----------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
